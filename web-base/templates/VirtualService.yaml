{{- $ := . }}
{{- $httpPort := "" }}
{{- $grpcPort := "" }}
{{- range .Values.development.ports }}
  {{- if eq .name "http" }}
    {{- $_ := set $ "httpPort" .port }}
  {{- end }}
  {{- if eq .name "grpc" }}
    {{- $_ := set $ "grpcPort" .port }}
  {{- end }}
{{- end }}
--- 
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-virtualservice
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  hosts:
    {{- range .Values.infrastructure.gateway.host }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - {{ .Values.infrastructure.gateway.gatewayName }}
  http:

    # 🔵 ปกติ → Blue
    - match:
        - uri:
            prefix: {{ .Values.development.prefix }}
      route:
        - destination:
            host: {{ .Release.Name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            subset: {{ .Values.image.Blue.version }}
            port:
              number: {{ $.httpPort }}
          weight: 100

    {{- if .Values.development.grpc.enabled }}
    # ⚙️ gRPC Routing เฉพาะ port 8085 และ header
    - match:
        - port: 8085
          headers:
            X-gRPC-Service:
              exact: "{{ .Release.Name }}"
      route:
        - destination:
            host: {{ .Release.Name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            subset: {{ .Values.image.Blue.version }}  # หรือ Blue ตามต้องการ
            port:
              number: {{ $.grpcPort }}
    {{- end }}
    # Optional: CORS
      corsPolicy:
        allowOrigin:
        {{- range .Values.infrastructure.gateway.allowOrigin }}
          - {{ . | quote }}
        {{- end }}
        allowMethods:
          - POST
          - GET
          - PATCH
          - DELETE
          - PUT
          - OPTIONS
        allowHeaders:
          - "*"
        maxAge: "24h"
        allowCredentials: true