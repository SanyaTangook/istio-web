{{- $httpPort := 0 }}
{{- range .Values.development.ports }}
  {{- if eq .name "http" }}
    {{- $httpPort = .port }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      version: {{ .Values.image.Blue.version }}
      color: Blue
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: {{ .Values.image.Blue.version }}
        color: Blue
        chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        release: {{ .Release.Name }}
        heritage: {{ .Release.Service }}
      annotations:
        reloader.stakater.com/auto: 'true'
    spec:
      containers:
        - name: {{ .Release.Name }}-container
          image: {{ .Values.image.repository }}:{{ .Values.image.Blue.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-configmap
          ports:
          {{- range .Values.development.ports }}
            - containerPort: {{ .port }}
          {{- end }}
          {{- if .Values.development.healthcheck.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.development.healthcheck.path }}
              port: {{ $httpPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.development.healthcheck.path }}
              port: {{ $httpPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          {{- end }}
          resources:
            requests:
              memory: {{ .Values.infrastructure.resource.requests.memory }}
            limits:
              memory: {{ .Values.infrastructure.resource.limits.memory }}
      terminationGracePeriodSeconds: 100
